name: Update Threads stock dashboard

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours
  workflow_dispatch:
    inputs:
      handle:
        description: "Threads handle (no @)"
        required: false
        default: evachien.chien
      refresh_fundamentals:
        description: "Refresh TWSE/TPEx fundamentals"
        required: false
        default: "true"

permissions:
  contents: write   # to commit data/ back to the branch
  pages: write
  id-token: write

concurrency:
  group: threads-update
  cancel-in-progress: false

jobs:
  fetch-analyze:
    runs-on: ubuntu-latest
    env:
      HANDLE: ${{ github.event.inputs.handle || 'evachien.chien' }}
      REFRESH_FUNDAMENTALS: ${{ github.event.inputs.refresh_fundamentals || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Run test suite
        run: |
          python tests/test_parser.py
          python tests/test_e2e.py
          python tests/test_stocks.py
          python tests/test_storage.py
          python tests/test_fundamentals.py

      - name: Fetch profile + posts (browser mode)
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p data debug
          python main.py -v --db data/threads.db track "$HANDLE" \
            --browser \
            --scroll-rounds 6 \
            --settle-ms 5000 \
            --post-pages 6 \
            --dump-dir debug/ \
            --show 10

      - name: Analyse stocks
        id: analyse
        continue-on-error: true
        run: |
          REFRESH_FLAG=""
          if [ "$REFRESH_FUNDAMENTALS" = "true" ]; then
            REFRESH_FLAG="--refresh-universe --refresh-fundamentals"
          fi
          python main.py --db data/threads.db stocks "$HANDLE" \
            --out data/latest.json \
            --top 30 \
            $REFRESH_FLAG

      - name: Generate dashboard (with placeholder fallback)
        run: |
          mkdir -p public
          # Render to a temp file and atomically mv on success so a partial
          # write doesn't leave broken HTML behind.
          rm -f public/index.html
          if [ -f data/latest.json ]; then
            if python scripts/render_dashboard.py data/latest.json public/index.html.tmp; then
              mv public/index.html.tmp public/index.html
            else
              echo "::warning::render_dashboard.py failed; will publish placeholder"
              rm -f public/index.html.tmp
            fi
          fi
          if [ ! -f public/index.html ]; then
            cp public/placeholder.html public/index.html
          fi
          ls -la public/

      - name: Commit data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: refresh @${HANDLE} data"
            # Rebase + push. If rebase finds a conflict (e.g. two runs both
            # wrote data/threads.db) we abort cleanly rather than silently
            # losing one run's data. Retry only the push for transient
            # network errors.
            pushed=0
            for attempt in 1 2 3; do
              if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
                echo "::warning::git rebase failed; aborting and dropping this run's data commit"
                git rebase --abort 2>/dev/null || true
                break
              fi
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" = "0" ]; then
              echo "::warning::push did not succeed; Pages will still deploy from artifact"
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-enable Pages on the repo if not yet on

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-debug
          # data/ already lives in git; uploading it would burn artifact
          # quota fast (~10 MB/run × 6 runs/day × 14 days = ~840 MB).
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail if fetch failed
        # cmd_stocks now exits 0 on empty (analyse can't usefully fail unless
        # the universe/fundamentals refresh blew up, which we already log).
        # Treat the fetch step as the source of truth.
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Threads fetch failed — see logs above."
          exit 1

  deploy-pages:
    needs: fetch-analyze
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
