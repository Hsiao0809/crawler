name: Update Threads stock dashboard

on:
  # Trigger on push so each iteration auto-runs and I can see the error.
  push:
    branches:
      - claude/threads-account-tracker-GF7JQ
      - main
    paths-ignore:
      - "data/**"
      - "public/index.html"
      - "**.md"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      handle:
        description: "Threads handle (no @)"
        required: false
        default: evachien.chien
      refresh_fundamentals:
        description: "Refresh TWSE/TPEx fundamentals"
        required: false
        default: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: threads-update
  cancel-in-progress: false

jobs:
  fetch-analyze:
    runs-on: ubuntu-latest
    env:
      HANDLE: ${{ github.event.inputs.handle || 'evachien.chien' }}
      REFRESH_FUNDAMENTALS: ${{ github.event.inputs.refresh_fundamentals || 'true' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for rebase to work cleanly

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Diagnose runner
        run: |
          echo "::group::Runner info"
          uname -a
          python --version
          pip --version
          df -h .
          free -m || true
          echo "::endgroup::"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -c "import requests, playwright; print('python deps OK')"

      - name: Install Chromium for Playwright
        run: |
          echo "::group::playwright install --with-deps chromium"
          playwright install --with-deps chromium 2>&1 | tail -50
          echo "::endgroup::"
          # `playwright install` sometimes returns 0 even on download failure.
          # Confirm the executable actually landed.
          python - <<'PY'
          import sys
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              path = pw.chromium.executable_path
              import os
              if not os.path.exists(path):
                  sys.exit(f"chromium binary missing at {path}")
              print("chromium OK at", path)
          PY

      - name: Run test suite
        run: |
          set -e
          for t in tests/test_parser.py tests/test_e2e.py tests/test_stocks.py tests/test_storage.py tests/test_fundamentals.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

      - name: Fetch profile + posts (browser mode)
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p data debug
          python main.py -v --db data/threads.db track "$HANDLE" \
            --browser \
            --scroll-rounds 6 \
            --settle-ms 5000 \
            --post-pages 6 \
            --dump-dir debug/ \
            --show 10
          echo "fetch.exitcode=$?"

      - name: Diagnose post-fetch state
        if: always()
        run: |
          echo "::group::data/"
          ls -la data/ 2>/dev/null || echo "(no data/)"
          echo "::endgroup::"
          echo "::group::debug/"
          ls -la debug/ 2>/dev/null || echo "(no debug/)"
          echo "::endgroup::"
          if [ -f data/threads.db ]; then
            python -c "
          import sqlite3
          conn = sqlite3.connect('data/threads.db')
          for tbl in ['accounts', 'posts', 'post_snapshots']:
              try:
                  n = conn.execute(f'SELECT COUNT(*) FROM {tbl}').fetchone()[0]
                  print(f'  {tbl}: {n} rows')
              except sqlite3.OperationalError as e:
                  print(f'  {tbl}: {e}')
          "
          fi

      - name: Analyse stocks
        id: analyse
        continue-on-error: true
        run: |
          REFRESH_FLAG=""
          if [ "$REFRESH_FUNDAMENTALS" = "true" ]; then
            REFRESH_FLAG="--refresh-universe --refresh-fundamentals"
          fi
          python main.py --db data/threads.db stocks "$HANDLE" \
            --out data/latest.json \
            --top 30 \
            $REFRESH_FLAG

      - name: Generate dashboard (with placeholder fallback)
        run: |
          mkdir -p public
          rm -f public/index.html
          if [ -f data/latest.json ]; then
            if python scripts/render_dashboard.py data/latest.json public/index.html.tmp; then
              mv public/index.html.tmp public/index.html
            else
              echo "::warning::render_dashboard.py failed; will publish placeholder"
              rm -f public/index.html.tmp
            fi
          fi
          if [ ! -f public/index.html ]; then
            cp public/placeholder.html public/index.html
          fi
          ls -la public/
          wc -c public/index.html

      - name: Commit data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: refresh @${HANDLE} data"
            pushed=0
            for attempt in 1 2 3; do
              if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
                echo "::warning::git rebase failed; aborting this run's data commit"
                git rebase --abort 2>/dev/null || true
                break
              fi
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              echo "push attempt $attempt failed; sleeping…"
              sleep $((attempt * 5))
            done
            if [ "$pushed" = "0" ]; then
              echo "::warning::push did not succeed; Pages will still deploy from artifact"
            fi
          fi

      - name: Configure Pages
        # No `enablement: true`: that requires admin scope on the token which
        # GITHUB_TOKEN doesn't have by default. The repo's Settings →
        # Pages → Source must be set to "GitHub Actions" once, manually.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-debug
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Threads fetch failed — see logs above."
          exit 1

  deploy-pages:
    needs: fetch-analyze
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
