name: Update Threads stock dashboard

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours
  workflow_dispatch:
    inputs:
      handle:
        description: "Threads handle (no @)"
        required: false
        default: evachien.chien
      refresh_fundamentals:
        description: "Refresh TWSE/TPEx fundamentals"
        required: false
        default: "true"

permissions:
  contents: write   # to commit data/ back to the branch
  pages: write
  id-token: write

concurrency:
  group: threads-update
  cancel-in-progress: false

jobs:
  fetch-analyze:
    runs-on: ubuntu-latest
    env:
      HANDLE: ${{ github.event.inputs.handle || 'evachien.chien' }}
      REFRESH_FUNDAMENTALS: ${{ github.event.inputs.refresh_fundamentals || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch profile + posts (browser mode)
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p data debug
          python main.py -v --db data/threads.db track "$HANDLE" \
            --browser \
            --scroll-rounds 6 \
            --settle-ms 5000 \
            --post-pages 6 \
            --dump-dir debug/ \
            --show 10

      - name: Analyse stocks
        id: analyse
        continue-on-error: true
        run: |
          REFRESH_FLAG=""
          if [ "$REFRESH_FUNDAMENTALS" = "true" ]; then
            REFRESH_FLAG="--refresh-universe --refresh-fundamentals"
          fi
          python main.py --db data/threads.db stocks "$HANDLE" \
            --out data/latest.json \
            --top 30 \
            $REFRESH_FLAG

      - name: Generate dashboard (with placeholder fallback)
        run: |
          mkdir -p public
          if [ -f data/latest.json ]; then
            python scripts/render_dashboard.py data/latest.json public/index.html
          fi
          # Ensure index.html exists even when fetch/analyse failed, so the
          # Pages deploy doesn't blow up on first run or transient errors.
          if [ ! -f public/index.html ]; then
            cp public/placeholder.html public/index.html
          fi
          ls -la public/

      - name: Commit data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: refresh @${HANDLE} data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-debug
          path: |
            data/
            debug/
          retention-days: 14

      - name: Fail if both fetch and analyse failed
        if: steps.fetch.outcome == 'failure' && steps.analyse.outcome == 'failure'
        run: |
          echo "Both fetch and analyse failed — see logs above."
          exit 1

  deploy-pages:
    needs: fetch-analyze
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
